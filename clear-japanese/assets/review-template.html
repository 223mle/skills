<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>clear-japanese レビュー</title>
<style>
  :root {
    --paper: #F6F7F9;
    --card: #FFFFFF;
    --ink: #212936;
    --muted: #66707F;
    --line: #DDE2EA;
    --accent: #3B5BA5;
    --accent-soft: #E8EDF7;
    --accent-ink: #FFFFFF;
    --del-bg: #FDEBEE;
    --del-hl: #F6C6CE;
    --del-ink: #A82333;
    --ins-bg: #E9F5EC;
    --ins-hl: #C2E5CC;
    --ins-ink: #1E7A3C;
    --sev-high: #A82333;
    --sev-mid: #A16207;
    --sev-low: #5A6472;
    --chrome: #EDEFF3;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #14181F; --card: #1C222C; --ink: #E4E8EF; --muted: #939CAB;
      --line: #323A47; --accent: #7C9BE8; --accent-soft: #263250; --accent-ink: #10151E;
      --del-bg: #3A2127; --del-hl: #5C2C36; --del-ink: #F0919E;
      --ins-bg: #1D3226; --ins-hl: #2C4A36; --ins-ink: #7FD098;
      --sev-high: #F0919E; --sev-mid: #E0B45C; --sev-low: #939CAB; --chrome: #232A36;
    }
  }
  * { box-sizing: border-box; }
  body {
    background: var(--paper); color: var(--ink); margin: 0; font-size: 15px; line-height: 1.75;
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 40px 24px 24px; }

  header h1 { font-size: 21px; font-weight: 700; margin: 0 0 4px; text-wrap: balance; }
  header .meta { color: var(--muted); font-size: 13px; }
  header .meta code { font-family: var(--mono); font-size: 12.5px; }
  header .summary {
    margin: 14px 0 0; padding: 12px 18px; background: var(--card);
    border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0; max-width: 46em;
  }

  .panel {
    margin-top: 24px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--card); box-shadow: 0 2px 12px rgba(20, 30, 50, 0.06); overflow: hidden;
  }
  .toolbar {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 12px 18px; border-bottom: 1px solid var(--line); font-size: 13px;
  }
  .toolbar .stat { color: var(--muted); margin-right: 8px; }
  .toolbar .group { display: flex; gap: 4px; align-items: center; }
  .toolbar .group + .group { margin-left: 12px; }
  .toolbar .glabel { color: var(--muted); font-size: 12px; margin-right: 2px; }

  button {
    font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer;
    border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--ink);
    padding: 4px 12px;
  }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .toolbar button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button.accept.on { background: var(--ins-bg); border-color: var(--ins-ink); color: var(--ins-ink); }
  button.reject.on { background: var(--del-bg); border-color: var(--del-ink); color: var(--del-ink); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); padding: 6px 16px; }
  kbd {
    font-family: var(--mono); font-size: 11px; background: var(--paper);
    border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px;
  }

  .sev { font-size: 11px; font-weight: 700; border-radius: 4px; padding: 1px 7px; letter-spacing: 0.04em; flex-shrink: 0; }
  .sev.高 { color: var(--sev-high); border: 1.5px solid var(--sev-high); }
  .sev.中 { color: var(--sev-mid);  border: 1.5px solid var(--sev-mid); }
  .sev.低 { color: var(--sev-low);  border: 1.5px solid var(--sev-low); }
  .layer {
    font-size: 11px; font-weight: 600; color: var(--muted); flex-shrink: 0;
    background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 1px 7px;
  }
  del { background: var(--del-hl); color: var(--del-ink); text-decoration: line-through; text-decoration-thickness: 1px; border-radius: 2px; padding: 0 1px; }
  ins { background: var(--ins-hl); color: var(--ins-ink); text-decoration: none; border-radius: 2px; padding: 0 1px; }

  .card { border-bottom: 1px solid var(--line); }
  .card:last-of-type { border-bottom: none; }
  .card.hidden { display: none; }
  .card.kfocus { outline: 2px solid var(--accent); outline-offset: -2px; }
  .card .head {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 10px 18px; background: var(--paper); border-bottom: 1px solid var(--line); font-size: 13px;
  }
  .card .head .title { font-weight: 700; }
  .card .head .where { color: var(--muted); font-size: 12px; font-family: var(--mono); margin-left: auto; }
  .card .head .actions { display: flex; gap: 6px; }
  .card .head .where + .actions { margin-left: 0; }
  .card .head .actions:first-of-type { margin-left: auto; }

  .diff { font-family: var(--mono); font-size: 13px; line-height: 1.9; overflow-x: auto; }
  .diff .row { display: flex; }
  .diff .gutter {
    flex: 0 0 40px; text-align: right; padding-right: 10px; color: var(--muted);
    user-select: none; font-size: 11.5px; opacity: 0.7;
  }
  .diff .sign { flex: 0 0 16px; text-align: center; font-weight: 700; }
  .diff .text { padding: 0 14px 0 4px; flex: 1; white-space: pre-wrap; word-break: break-word; }
  .diff .row.minus { background: var(--del-bg); }
  .diff .row.plus  { background: var(--ins-bg); }
  .diff .row.minus .sign { color: var(--del-ink); }
  .diff .row.plus .sign  { color: var(--ins-ink); }
  .diff .row.plus .text[contenteditable]:focus {
    outline: 2px dashed var(--accent); outline-offset: -2px; border-radius: 3px;
  }
  .reason { padding: 8px 18px 14px; font-size: 12.5px; color: var(--muted); }
  .reason b { color: var(--ink); font-weight: 600; }
  .card.state-accept { box-shadow: inset 3px 0 0 var(--ins-ink); }
  .card.state-reject { box-shadow: inset 3px 0 0 var(--del-ink); }
  .card.state-reject .diff, .card.state-reject .reason { opacity: 0.45; }

  .copybar {
    position: sticky; bottom: 0; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 12px 24px; margin: 0 -24px; background: var(--chrome);
    border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted);
  }
  .copybar .keys { margin-left: auto; display: flex; gap: 10px; align-items: center; }
  .output {
    margin: 16px 0 0; padding: 14px 18px; font-family: var(--mono); font-size: 12px; line-height: 1.7;
    background: var(--card); border: 1px solid var(--line); border-radius: 8px;
    white-space: pre-wrap; word-break: break-word; display: none;
  }
  .output.show { display: block; }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
  @media (max-width: 640px) { .copybar .keys { display: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>clear-japanese レビュー</h1>
    <div class="meta">対象: <code id="h-doc"></code>　<span id="h-date"></span></div>
    <p class="summary" id="h-summary" hidden></p>
  </header>

  <div class="panel">
    <div class="toolbar">
      <span class="stat" id="t-stat"></span>
      <span class="group" id="f-sev"><span class="glabel">重大度:</span></span>
      <span class="group" id="f-layer"><span class="glabel">層:</span></span>
    </div>
    <div id="cards"></div>
  </div>

  <div class="copybar">
    <button class="primary" id="copy-btn">結果をコピーしてチャットに貼る</button>
    <span id="c-status"></span>
    <span class="keys">
      <kbd>J</kbd>/<kbd>K</kbd> 移動　<kbd>A</kbd> 採用　<kbd>R</kbd> 却下　<kbd>E</kbd> 編集　<kbd>Esc</kbd> 編集終了
    </span>
  </div>
  <pre class="output" id="output"></pre>
</div>

<script>
"use strict";
const DATA = __REVIEW_DATA__;

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// ---- 文字単位の LCS 差分（長文は全置換にフォールバック） ----
function diffChars(a, b) {
  if (a === b) return [[0, a]];
  if (a.length * b.length > 400000) return [[-1, a], [1, b]];
  const n = a.length, m = b.length;
  const dp = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--)
    for (let j = m - 1; j >= 0; j--)
      dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const ops = [];
  const push = (op, ch) => {
    const last = ops[ops.length - 1];
    if (last && last[0] === op) last[1] += ch; else ops.push([op, ch]);
  };
  let i = 0, j = 0;
  while (i < n && j < m) {
    if (a[i] === b[j]) { push(0, a[i]); i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) { push(-1, a[i]); i++; }
    else { push(1, b[j]); j++; }
  }
  while (i < n) push(-1, a[i++]);
  while (j < m) push(1, b[j++]);
  return ops;
}
const minusHtml = ops => ops.filter(o => o[0] <= 0).map(o => o[0] < 0 ? "<del>" + esc(o[1]) + "</del>" : esc(o[1])).join("");
const plusHtml  = ops => ops.filter(o => o[0] >= 0).map(o => o[0] > 0 ? "<ins>" + esc(o[1]) + "</ins>" : esc(o[1])).join("");

// ---- 描画 ----
document.getElementById("h-doc").textContent = DATA.doc || "";
document.getElementById("h-date").textContent = DATA.date || "";
document.title = "clear-japanese レビュー — " + (DATA.doc || "");
if (DATA.summary) {
  const s = document.getElementById("h-summary");
  s.textContent = DATA.summary;
  s.hidden = false;
}

const findings = DATA.findings || [];
const cardsEl = document.getElementById("cards");
if (!findings.length) cardsEl.innerHTML = '<div class="empty">指摘はありません。</div>';

for (const f of findings) {
  const ops = diffChars(f.before || "", f.after || "");
  const line = f.line != null ? esc(f.line) : "";
  const card = document.createElement("div");
  card.className = "card";
  card.dataset.id = f.id;
  card.innerHTML =
    '<div class="head">' +
      '<span class="sev ' + esc(f.severity) + '">' + esc(f.severity) + "</span>" +
      '<span class="layer">' + esc(f.layer) + "</span>" +
      '<span class="title">' + esc(f.title) + "</span>" +
      '<span class="where">' + esc(f.location || "") + "</span>" +
      '<span class="actions">' +
        '<button class="accept">採用</button>' +
        '<button class="reject">却下</button>' +
      "</span>" +
    "</div>" +
    '<div class="diff">' +
      '<div class="row minus"><span class="gutter">' + line + '</span><span class="sign">−</span><span class="text">' + minusHtml(ops) + "</span></div>" +
      '<div class="row plus"><span class="gutter">' + line + '</span><span class="sign">+</span><span class="text" contenteditable="true">' + plusHtml(ops) + "</span></div>" +
    "</div>" +
    '<div class="reason"><b>理由:</b> ' + esc(f.reason || "") + "</div>";
  cardsEl.appendChild(card);
}

// ---- フィルタ ----
const filters = { sev: "all", layer: "all" };
function makeFilter(groupId, key, values) {
  const group = document.getElementById(groupId);
  const count = v => findings.filter(f => v === "all" || f[key === "sev" ? "severity" : "layer"] === v).length;
  for (const v of values) {
    if (v !== "all" && !count(v)) continue;
    const b = document.createElement("button");
    b.textContent = (v === "all" ? "すべて" : v) + " " + count(v);
    if (v === "all") b.classList.add("on");
    b.addEventListener("click", () => {
      filters[key] = v;
      group.querySelectorAll("button").forEach(x => x.classList.remove("on"));
      b.classList.add("on");
      applyFilters();
    });
    group.appendChild(b);
  }
}
makeFilter("f-sev", "sev", ["all", "高", "中", "低"]);
makeFilter("f-layer", "layer", ["all", "語彙", "文", "構造", "AIっぽさ"]);
function applyFilters() {
  for (const card of cardsEl.children) {
    if (!card.dataset.id) continue;
    const f = findings.find(x => String(x.id) === card.dataset.id);
    const ok = (filters.sev === "all" || f.severity === filters.sev) &&
               (filters.layer === "all" || f.layer === filters.layer);
    card.classList.toggle("hidden", !ok);
  }
  if (focused && focused.classList.contains("hidden")) setFocus(null);
}

// ---- 採用 / 却下 ----
cardsEl.addEventListener("click", e => {
  const btn = e.target.closest("button.accept, button.reject");
  if (!btn) return;
  const card = btn.closest(".card");
  const kind = btn.classList.contains("accept") ? "accept" : "reject";
  const wasOn = btn.classList.contains("on");
  card.querySelectorAll(".actions button").forEach(b => b.classList.remove("on"));
  card.classList.remove("state-accept", "state-reject");
  if (!wasOn) {
    btn.classList.add("on");
    card.classList.add("state-" + kind);
  }
  updateStatus();
});
function stateOf(card) {
  return card.classList.contains("state-accept") ? "採用"
       : card.classList.contains("state-reject") ? "却下" : "未判断";
}
function updateStatus() {
  const cards = [...cardsEl.querySelectorAll(".card")];
  const undecided = cards.filter(c => stateOf(c) === "未判断").length;
  document.getElementById("c-status").textContent =
    cards.length === 0 ? "" : undecided === 0 ? "すべて判断済み" : "未判断: " + undecided + "件";
  const bySev = s => findings.filter(f => f.severity === s).length;
  document.getElementById("t-stat").textContent =
    "指摘 " + findings.length + "件（高 " + bySev("高") + " / 中 " + bySev("中") + " / 低 " + bySev("低") + "）";
}
updateStatus();

// ---- コピー ----
document.getElementById("copy-btn").addEventListener("click", () => {
  const lines = ["## clear-japanese レビュー反映指示", "対象: " + (DATA.doc || ""), ""];
  for (const card of cardsEl.querySelectorAll(".card")) {
    const f = findings.find(x => String(x.id) === card.dataset.id);
    const state = stateOf(card);
    const after = card.querySelector(".row.plus .text").textContent;
    const edited = state === "採用" && after.trim() !== (f.after || "").trim();
    lines.push("- 指摘" + f.id + "（" + f.title + "）: " + state + (edited ? "（編集あり）" : ""));
    if (state === "採用") lines.push(...after.split("\n").map(l => "  修正後: " + l).slice(0, 1).concat(after.split("\n").slice(1).map(l => "    " + l)));
  }
  const text = lines.join("\n");
  const out = document.getElementById("output");
  out.textContent = text;
  out.classList.add("show");
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(
      () => { document.getElementById("c-status").textContent = "クリップボードにコピーしました。チャットに貼り付けてください。"; },
      () => { document.getElementById("c-status").textContent = "コピーできませんでした。下のテキストを手動でコピーしてください。"; }
    );
  } else {
    document.getElementById("c-status").textContent = "下のテキストを手動でコピーしてください。";
  }
});

// ---- キーボード操作 ----
let focused = null;
function visibleCards() { return [...cardsEl.querySelectorAll(".card:not(.hidden)")]; }
function setFocus(card) {
  if (focused) focused.classList.remove("kfocus");
  focused = card;
  if (focused) {
    focused.classList.add("kfocus");
    focused.scrollIntoView({ block: "nearest" });
  }
}
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const editing = document.activeElement && document.activeElement.isContentEditable;
  if (editing) {
    if (e.key === "Escape") document.activeElement.blur();
    return;
  }
  const cards = visibleCards();
  if (!cards.length) return;
  const idx = focused ? cards.indexOf(focused) : -1;
  const key = e.key.toLowerCase();
  if (key === "j") setFocus(cards[Math.min(idx + 1, cards.length - 1)]);
  else if (key === "k") setFocus(cards[Math.max(idx - 1, 0)]);
  else if ((key === "a" || key === "r") && focused)
    focused.querySelector(key === "a" ? "button.accept" : "button.reject").click();
  else if (key === "e" && focused)
    focused.querySelector(".row.plus .text").focus();
  else return;
  e.preventDefault();
});
</script>
</body>
</html>
